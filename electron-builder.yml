appId: com.picxel.desktop
productName: Picxel
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json
asarUnpack:
  # package.json next to dist/ so Node treats dist/index.js as ESM (type: module).
  - package.json
  - dist/**/*
  # sharp loads native .node binaries — cannot run from inside app.asar
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/keytar/**/*
extraResources:
  # Written in CI from secrets; loaded by Electron before spawning the embedded server.
  - from: electron-desktop-env/
    filter:
      - desktop.env
mac:
  target:
    - dmg
    - zip
  category: public.app-category.graphics-design
win:
  target:
    - nsis
publish:
  provider: github
  owner: JodieMar21
  repo: picxel-puzzle
  releaseType: release
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
