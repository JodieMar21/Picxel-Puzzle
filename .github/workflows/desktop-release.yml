name: Desktop Release

on:
  push:
    branches:
      - deployment
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release after build"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  # Split platforms so `release` can run when only one OS succeeds (partial release).
  build_windows:
    name: Build desktop app (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write packaged desktop.env (embedded server)
        shell: bash
        run: |
          mkdir -p electron-desktop-env
          : > electron-desktop-env/desktop.env
          append() { [ -n "${2:-}" ] && printf '%s=%s\n' "$1" "$2" >> electron-desktop-env/desktop.env || true; }
          append DATABASE_URL "$DATABASE_URL"
          append LICENSE_SIGNING_SECRET "$LICENSE_SIGNING_SECRET"
          append APP_BASE_URL "$APP_BASE_URL"
          append STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          append STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          append STRIPE_PRICE_ID "$STRIPE_PRICE_ID"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}

      - name: Build desktop packages
        run: npm run build:desktop
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          # Build unsigned — code signing is reserved for the iOS pipeline only.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Debug Windows release contents
        run: |
          echo "=== Contents of release/ directory ==="
          find release -type f | sort || echo "release/ directory is empty or does not exist"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fractix-windows-latest
          path: release/**

  build_macos:
    name: Build desktop app (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write packaged desktop.env (embedded server)
        shell: bash
        run: |
          mkdir -p electron-desktop-env
          : > electron-desktop-env/desktop.env
          append() { [ -n "${2:-}" ] && printf '%s=%s\n' "$1" "$2" >> electron-desktop-env/desktop.env || true; }
          append DATABASE_URL "$DATABASE_URL"
          append LICENSE_SIGNING_SECRET "$LICENSE_SIGNING_SECRET"
          append APP_BASE_URL "$APP_BASE_URL"
          append STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          append STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          append STRIPE_PRICE_ID "$STRIPE_PRICE_ID"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}

      - name: Build desktop packages
        run: npm run build:desktop
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}   
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          # Build unsigned — code signing is reserved for the iOS pipeline only.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Debug macOS release contents
        run: |
          echo "=== Contents of release/ directory ==="
          find release -type f | sort || echo "release/ directory is empty or does not exist"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fractix-macos-latest
          path: release/**

  build_ios:
    name: Build iPad/iOS app (Capacitor)
    runs-on: macos-latest
    # Completely independent — failure here never blocks Windows/macOS or the release job.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure iOS signing
        id: ios_signing
        shell: bash
        run: |
          if [[ -n "${CSC_LINK_RAW:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "IOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
            echo "Signing enabled (CSC_LINK present) — building device .ipa"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "IOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "No CSC_LINK — skipping cert import; building unsigned iOS Simulator .zip"
          fi
        env:
          CSC_LINK_RAW: ${{ secrets.CSC_LINK }}

      - name: Import code signing certificate
        if: steps.ios_signing.outputs.enabled == 'true'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Fixed path with .p12 extension — avoids mktemp's macOS suffix-append
          # bug that strips the extension and breaks security import auto-detect.
          CERT_PATH: ${{ runner.temp }}/fractix-ios-signing.p12
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          # Use Node.js to decode — handles both raw base64 and the
          # data:application/x-pkcs12;base64,<b64> data URI format.
          # Avoids the macOS base64 binary's lack of --decode support.
          CERT_OUT_PATH="$CERT_PATH" node -e "
            const fs = require('fs');
            const val = (process.env.P12_BASE64 || '').trim();
            const b64 = val.startsWith('data:')
              ? val.substring(val.indexOf(',') + 1).replace(/\s/g, '')
              : val.replace(/\s/g, '');
            fs.writeFileSync(process.env.CERT_OUT_PATH, Buffer.from(b64, 'base64'));
          "

          security create-keychain -p "$KEYCHAIN_PASSWORD" signing_temp.keychain
          security set-keychain-settings -lut 21600 signing_temp.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing_temp.keychain

          security import "$CERT_PATH" \
            -k signing_temp.keychain \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -P "$P12_PASSWORD"

          # Allow codesign to access the key without prompting
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" signing_temp.keychain

          # Prepend the temp keychain to the user search list
          EXISTING=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          security list-keychains -d user -s signing_temp.keychain $EXISTING

          rm -f "$CERT_PATH"

      - name: Build iOS artifact
        run: npm run build:ios
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Debug iOS release contents
        run: find release -type f | sort || echo "Nothing in release/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fractix-ios-latest
          path: |
            release/*.ipa
            release/*.zip

  release:
    name: Publish GitHub Release
    needs: [build_windows, build_macos, build_ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Tag or manual publish; at least one DESKTOP platform must succeed.
    # build_ios is listed in needs so its artifacts are available, but its
    # result is never required — iOS failure never blocks the release.
    if: |
      always() &&
      (
        needs.build_windows.result == 'success' ||
        needs.build_macos.result == 'success'
      ) &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true')
      )

    steps:
      - name: Download Windows artifacts
        if: needs.build_windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: fractix-windows-latest
          path: release/windows

      - name: Download macOS artifacts
        if: needs.build_macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: fractix-macos-latest
          path: release/macos

      - name: Download iOS artifacts
        if: needs.build_ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: fractix-ios-latest
          path: release/ios

      - name: Debug release folder contents
        run: |
          echo "=== Full release/ tree ==="
          find release -type f | sort || echo "Nothing found in release/"

      - name: Collect release files
        id: files
        run: |
          mkdir -p release
          mapfile -t paths < <(find release -type f \( \
            -name '*.exe' -o \
            -name '*.dmg' -o \
            -name '*.zip' -o \
            -name '*.ipa' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.pkg' -o \
            -name '*.msi' -o \
            -name '*.nsis' \
          \) 2>/dev/null | sort -u)

          if [ ${#paths[@]} -eq 0 ]; then
            echo "ERROR: No installable artifacts found under release/"
            echo "Files present:"
            find release -type f | sort
            exit 1
          fi

          echo "Found artifacts:"
          printf '  %s\n' "${paths[@]}"

          {
            echo 'list<<EOF'
            printf '%s\n' "${paths[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Fractix ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.files.outputs.list }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
