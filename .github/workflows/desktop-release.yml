name: Desktop Release

on:
  push:
    branches:
      - deployment
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release after build"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  # Split platforms so `release` can run when only one OS succeeds (partial release).
  build_windows:
    name: Build desktop app (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write packaged desktop.env (embedded server)
        shell: bash
        run: |
          mkdir -p electron-desktop-env
          : > electron-desktop-env/desktop.env
          append() { [ -n "${2:-}" ] && printf '%s=%s\n' "$1" "$2" >> electron-desktop-env/desktop.env || true; }
          append DATABASE_URL "$DATABASE_URL"
          append LICENSE_SIGNING_SECRET "$LICENSE_SIGNING_SECRET"
          append APP_BASE_URL "$APP_BASE_URL"
          append STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          append STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          append STRIPE_PRICE_ID "$STRIPE_PRICE_ID"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}


      # CSC env only — do not run electron-builder/npm rebuild in bash on Windows:
      # node-gyp cannot locate Visual Studio from Git Bash and fails on bufferutil/keytar/sharp.
      - name: Configure code signing env
        shell: bash
        env:
          CSC_LINK_RAW: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_RAW: ${{ secrets.CSC_KEY_PASSWORD }}
          # Use runner.temp so the resolved path is the OS-native temp dir
          # (backslashes on Windows), which electron-builder and security import
          # both understand without any Git Bash path conversion.
          FRACTIX_CERT_PATH: ${{ runner.temp }}/fractix-signing.p12
        run: |
          if [[ -n "${CSC_LINK_RAW:-}" ]]; then
            echo "Signing enabled (CSC_LINK present)"
            # Use Node.js to decode — it handles any whitespace in the base64
            # string and writes binary data correctly on every platform.
            CERT_OUT_PATH="$FRACTIX_CERT_PATH" node -e "
              const fs = require('fs');
              const raw = (process.env.CSC_LINK_RAW || '').replace(/\s/g, '');
              fs.writeFileSync(process.env.CERT_OUT_PATH, Buffer.from(raw, 'base64'));
            "
            echo "CSC_LINK=$FRACTIX_CERT_PATH" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${CSC_KEY_PASSWORD_RAW:-}" >> "$GITHUB_ENV"
          else
            echo "No signing certificate; building unsigned"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Build desktop packages
        run: npm run build:desktop
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Debug Windows release contents
        run: |
          echo "=== Contents of release/ directory ==="
          find release -type f | sort || echo "release/ directory is empty or does not exist"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fractix-windows-latest
          path: release/**

  build_macos:
    name: Build desktop app (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write packaged desktop.env (embedded server)
        shell: bash
        run: |
          mkdir -p electron-desktop-env
          : > electron-desktop-env/desktop.env
          append() { [ -n "${2:-}" ] && printf '%s=%s\n' "$1" "$2" >> electron-desktop-env/desktop.env || true; }
          append DATABASE_URL "$DATABASE_URL"
          append LICENSE_SIGNING_SECRET "$LICENSE_SIGNING_SECRET"
          append APP_BASE_URL "$APP_BASE_URL"
          append STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          append STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          append STRIPE_PRICE_ID "$STRIPE_PRICE_ID"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}


      - name: Build desktop packages
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK_RAW: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_RAW: ${{ secrets.CSC_KEY_PASSWORD }}
          FRACTIX_CERT_PATH: ${{ runner.temp }}/fractix-signing.p12
        run: |
          if [[ -n "${CSC_LINK_RAW:-}" ]]; then
            echo "Signing enabled (CSC_LINK present)"
            # Use Node.js to decode — it handles any whitespace in the base64
            # string and writes binary data correctly on every platform.
            CERT_OUT_PATH="$FRACTIX_CERT_PATH" node -e "
              const fs = require('fs');
              const raw = (process.env.CSC_LINK_RAW || '').replace(/\s/g, '');
              fs.writeFileSync(process.env.CERT_OUT_PATH, Buffer.from(raw, 'base64'));
            "
            export CSC_LINK="$FRACTIX_CERT_PATH"
            export CSC_KEY_PASSWORD="${CSC_KEY_PASSWORD_RAW:-}"
          else
            echo "No signing certificate; building unsigned"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run build:desktop
          [ -f "${FRACTIX_CERT_PATH:-}" ] && rm -f "$FRACTIX_CERT_PATH" || true

      - name: Debug macOS release contents
        run: |
          echo "=== Contents of release/ directory ==="
          find release -type f | sort || echo "release/ directory is empty or does not exist"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fractix-macos-latest
          path: release/**

  build_ios:
    name: Build iPad/iOS app (Capacitor)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure iOS signing
        id: ios_signing
        shell: bash
        run: |
          if [[ -n "${CSC_LINK_RAW:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "IOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
            echo "Signing enabled (CSC_LINK present) — building device .ipa"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "IOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "No CSC_LINK — skipping cert import; building unsigned iOS Simulator .zip"
          fi
        env:
          CSC_LINK_RAW: ${{ secrets.CSC_LINK }}

      - name: Import code signing certificate
        if: steps.ios_signing.outputs.enabled == 'true'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          CERT_PATH=$(mktemp -t cert.XXXXXX.p12)

          # Strip any whitespace/newlines the secret may contain before decoding
          printf '%s' "$P12_BASE64" | tr -d '\n\r ' | base64 --decode > "$CERT_PATH"

          # Verify the decoded file is a valid PKCS12 before importing
          if ! openssl pkcs12 -in "$CERT_PATH" -passin "pass:${P12_PASSWORD}" \
              -nokeys -noout 2>/dev/null; then
            echo "::error::P12 certificate failed OpenSSL validation. Check that CSC_LINK is a" \
              "raw base64-encoded .p12 file and CSC_KEY_PASSWORD matches its export password."
            rm -f "$CERT_PATH"
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" signing_temp.keychain
          security set-keychain-settings -lut 21600 signing_temp.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing_temp.keychain

          security import "$CERT_PATH" \
            -k signing_temp.keychain \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -P "$P12_PASSWORD"

          # Allow codesign to access the key without prompting
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" signing_temp.keychain

          # Prepend the temp keychain to the user search list
          EXISTING=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          security list-keychains -d user -s signing_temp.keychain $EXISTING

          rm -f "$CERT_PATH"

      - name: Build iOS artifact
        run: npm run build:ios
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Debug iOS release contents
        run: find release -type f | sort || echo "Nothing in release/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fractix-ios-latest
          path: |
            release/*.ipa
            release/*.zip

  release:
    name: Publish GitHub Release
    needs: [build_windows, build_macos, build_ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Tag or manual publish; at least one platform must succeed (partial release OK).
    if: |
      always() &&
      (
        needs.build_windows.result == 'success' ||
        needs.build_macos.result == 'success' ||
        needs.build_ios.result == 'success'
      ) &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true')
      )

    steps:
      - name: Download Windows artifacts
        if: needs.build_windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: fractix-windows-latest
          path: release/windows

      - name: Download macOS artifacts
        if: needs.build_macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: fractix-macos-latest
          path: release/macos

      - name: Download iOS artifacts
        if: needs.build_ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: fractix-ios-latest
          path: release/ios

      - name: Debug release folder contents
        run: |
          echo "=== Full release/ tree ==="
          find release -type f | sort || echo "Nothing found in release/"

      - name: Collect release files
        id: files
        run: |
          mkdir -p release
          mapfile -t paths < <(find release -type f \( \
            -name '*.exe' -o \
            -name '*.dmg' -o \
            -name '*.zip' -o \
            -name '*.ipa' -o \
            -name '*-ios-simulator.zip' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.pkg' -o \
            -name '*.msi' -o \
            -name '*.nsis' \
          \) 2>/dev/null | sort -u)

          if [ ${#paths[@]} -eq 0 ]; then
            echo "ERROR: No installable artifacts found under release/"
            echo "Files present:"
            find release -type f | sort
            exit 1
          fi

          echo "Found artifacts:"
          printf '  %s\n' "${paths[@]}"

          {
            echo 'list<<EOF'
            printf '%s\n' "${paths[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Fractix ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.files.outputs.list }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
